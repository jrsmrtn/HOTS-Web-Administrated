name: Build and Release

# Push a tag such as v2.6.0 (or a commit with [release] in its message) to publish a release with:
#   - HOTS_Hosts_setup.exe            Windows installer (desktop app + remote-administration agent)
#   - HOTS_Console_Server.zip         web console for an Ubuntu server (deploy.sh inside, VERSION file)
#   - SHA256SUMS.txt

on:
  push:
    tags:
      - 'v*'
    # A commit whose message contains [release] publishes version.py's version (tag created by the
    # workflow). Any other push to these branches is ignored by this workflow (only CI runs).
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.6.0). Creates tag v<version> on the selected branch and the release. Leave empty to only build."
        required: false
        default: ""

jobs:
  versions:
    if: >-
      startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag and check it matches the program version
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          app=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' hosts_editor/version.py)
          iss=$(sed -n 's/^#define MyAppVersion "\(.*\)"/\1/p' setup.iss)
          publish=true
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_VERSION" ]; then tag="v$INPUT_VERSION"; else tag="v$app"; publish=false; fi
          else
            tag="v$app"
          fi
          echo "tag=$tag app=$app installer=$iss publish=$publish"
          if [ "${tag#v}" != "$app" ] || [ "${tag#v}" != "$iss" ]; then
            echo "::error::Tag $tag must match hosts_editor/version.py ($app) and setup.iss ($iss)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: versions
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==4.2.2
          pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --msvc=latest --assume-yes-for-downloads --windows-console-mode=disable `
            --windows-icon-from-ico="icon.ico" `
            --output-filename="HOTS Hosts.exe" `
            --output-dir=dist `
            --include-data-files="hosts_editor/graphic/logo.png=graphic/logo.png" `
            --include-data-files="hosts_editor/graphic/logo1.png=graphic/logo1.png" `
            --include-data-files="hosts_editor/graphic/logo.ico=graphic/logo.ico" `
            --include-data-files="hosts_editor/graphic/logoS.png=graphic/logoS.png" `
            --include-data-files="hosts_editor/graphic/support_me_on_kofi_dark.png=graphic/support_me_on_kofi_dark.png" `
            --include-data-files="hosts_editor/graphic/paypal_donate_button.png=graphic/paypal_donate_button.png" `
            --include-data-dir="hosts_editor/blocklists=blocklists" `
            --include-package=hosts_editor.remote `
            --include-module=hosts_editor.compliance `
            --include-module=hosts_editor.core_browser_policy `
            --include-module=hosts_editor.core_dnslock `
            --include-module=hosts_editor.core_networks `
            --include-module=hosts_editor.core_applocker `
            --include-module=hosts_editor.core_hardening `
            --include-module=hosts_editor.core_safesearch `
            --include-package-data=certifi `
            --enable-plugin=pyside6 `
            --nofollow-import-to=PIL `
            --nofollow-import-to=scipy `
            --nofollow-import-to=colorthief `
            hosts_editor_launcher.pyw

      - name: Smoke test the remote agent entry point
        shell: pwsh
        run: |
          # Not enrolled: --agent-run must exit cleanly (code 0) without opening any window.
          $p = Start-Process -FilePath "dist\hosts_editor_launcher.dist\HOTS Hosts.exe" -ArgumentList "--agent-run" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--agent-run exited with $($p.ExitCode)" }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        run: iscc setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Output/*.exe

  console-server:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the server and the agent protocol
        run: |
          python -m pip install -r server/requirements.txt pytest httpx
          python -m pytest -q server/tests

      - name: Build the server package
        shell: bash
        run: |
          # Stable name so that .../releases/latest/download/HOTS_Console_Server.zip always works.
          name="HOTS_Console_Server"
          mkdir -p "build/$name"
          cp -r server/hots_server server/requirements.txt server/README.md LICENSE.txt "build/$name/"
          cp server/deploy/deploy.sh server/deploy/install-mutualise.sh "build/$name/"
          chmod +x "build/$name/deploy.sh" "build/$name/install-mutualise.sh"
          # Pure-Python libraries for shared hosting (no pip / no root there): Python 3.11+ on any OS.
          python -m pip install --target "build/$name/vendor" --only-binary=:all: --python-version 3.11 \
            --implementation py --abi none --platform any -r server/requirements.txt
          rm -rf "build/$name/vendor/bin"
          echo "${{ needs.versions.outputs.tag }}" > "build/$name/VERSION"
          find "build/$name" -name '__pycache__' -prune -exec rm -rf {} +
          (cd build && zip -qr "$name.zip" "$name")
          # Smoke test of the no-root installer (shared hosting), from the packaged folder.
          bash "build/$name/install-mutualise.sh" --yes --no-cron --no-htaccess --domain console.example.org \
            --dir "$RUNNER_TEMP/hots-console"
          "$RUNNER_TEMP/hots-console/hots" status
          "$RUNNER_TEMP/hots-console/hots" stop
          ls -la build

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: console-server
          path: build/*.zip

  release:
    needs: [versions, windows-installer, console-server]
    runs-on: ubuntu-latest
    if: needs.versions.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versions.outputs.tag }}
          name: HOTS Hosts ${{ needs.versions.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            assets/*.exe
            assets/*.zip
            assets/SHA256SUMS.txt
          body: |
            ## Télécharger

            | Pour… | Fichier |
            |---|---|
            | 💻 Le PC à protéger (Windows 10/11) | **HOTS_Hosts_setup.exe** |
            | 🌐 Votre serveur de console (Ubuntu) | **HOTS_Console_Server.zip** — dézippez puis `sudo ./deploy.sh` |

            Guide d'installation de la console : [docs/CONSOLE_WEB.md](https://github.com/${{ github.repository }}/blob/${{ needs.versions.outputs.tag }}/docs/CONSOLE_WEB.md)
